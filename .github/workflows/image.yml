# Builds the Dockerfile, the image the k3s deployment runs (millennium-quiz-deploy),
# and pushes it to GitHub's registry from master:
#
#   ghcr.io/pareiss/millennium-quiz:sha-<7 characters>   one tag per commit, never moves
#   ghcr.io/pareiss/millennium-quiz:latest                the newest master
#
# The deployment should pin the sha tag (a `latest` that moves under a running
# cluster is a surprise). On a pull request the image is only built, never
# pushed, and only when something it is made of changed: nothing else in CI
# builds the Dockerfile, so a break there would otherwise show up at deploy time.
name: Image

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - mix.exs
      - mix.lock
      - config/**
      - rel/**
      - bin/fetch-vix-nif
      - bin/build-assets
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushing to ghcr.io with the job's own token; no other secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/millennium-quiz
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
