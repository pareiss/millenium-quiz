# The checks of `mix precommit`, without rewriting files: compile with warnings
# as errors, unused deps, formatting, and the tests with coverage; plus the
# tests of the PR review helpers (bin/review-tools). The outputs
# are uploaded as the "ci-results" artifact, which bin/review-pr hands to the
# reviewer.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.17.3-27.3-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-1.17.3-27.3-

      - run: mix deps.get

      # the vix (libvips) NIF can't be downloaded by Erlang's :httpc
      - run: bin/fetch-vix-nif

      - name: Checks
        shell: bash
        run: |
          mkdir -p ci-results
          status=0
          check() {
            local name="$1"; shift
            if "$@" >"ci-results/$name.txt" 2>&1; then
              echo "- $name: passed" >>ci-results/summary.md
            else
              echo "- $name: FAILED (\`$*\`)" >>ci-results/summary.md
              status=1
            fi
          }
          echo "# CI results for ${GITHUB_SHA}" >ci-results/summary.md
          echo >>ci-results/summary.md
          check compile mix compile --warnings-as-errors --force
          check unused-deps mix deps.unlock --check-unused
          check format mix format --check-formatted
          check tests mix test --cover
          check review-tools python3 -m unittest discover -s test/review
          cat ci-results/summary.md
          cat ci-results/tests.txt
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results
          path: ci-results/
          retention-days: 30
